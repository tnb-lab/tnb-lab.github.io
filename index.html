<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TNBL · Translational Neurobiology Lab</title>
  <meta name="description" content="Translational Neurobiology Lab (TNBL), Università G. d'Annunzio Chieti-Pescara.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="menu.js" defer></script>

  <!-- =========================================================
       SWISS HOMEPAGE
       These styles apply to this page only (everything starts
       with "body.swiss"), so the other pages are not affected.
       Colours come from style.css; the codes below are only a
       fallback in case style.css does not load.
       ========================================================= -->
  <style>
    body.swiss {
      --s-bg:      var(--bg, #ffffff);
      --s-text:    var(--text, #111111);
      --s-dim:     var(--dim, #777777);
      --s-line:    var(--line, #e4e4e4);
      --s-yellow:  var(--yellow, #e6a817);
      --s-peacock: var(--peacock, #1f7a8c);
      --s-sienna:  var(--sienna, #a8401e);
      --s-violet:  var(--violet, #2d2752);

      /* ===== TEXT SIZES — the same on every page =====
         Change a value here to change it on this page; keep the
         eight pages identical so the site stays consistent. */
      --fs-title: clamp(24px, 2.9vw, 42px);  /* page title */
      --fs-head:  clamp(19px, 2.1vw, 30px);  /* section heading: years, Alumni, theme numbers */
      --fs-sub:   clamp(15px, 1.6vw, 22px);  /* small heading: square numbers, floors, room names */
      --fs-quote: 10pt;                      /* quotes */
      --fs-body:  9pt;                       /* main text */
      --fs-small: 8pt;                       /* menu, dates, captions, footer */

      margin: 0;
      padding: 0;
      max-width: none;
      background: var(--s-bg);
      color: var(--s-text);
      font-family: "Courier Prime", "Courier New", monospace;
      font-size: var(--fs-body);
      line-height: 1.4;
    }

    /* The 12-column grid every block sits on */
    body.swiss .grid {
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      column-gap: 20px;
      padding: 0 40px;
      max-width: 1400px;
      margin: 0 auto;
      box-sizing: border-box;
    }

    /* ---------- header: logo + menu ---------- */
    body.swiss header {
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      column-gap: 20px;
      align-items: start;
      padding: 32px 40px 18px;
      max-width: 1400px;
      margin: 0 auto;
      box-sizing: border-box;
      border: 0;
      background: none;
    }
    body.swiss header .logo {
      grid-column: 1 / 4;
      font-size: var(--fs-body);
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--s-text);
      text-decoration: none;
    }
    body.swiss header nav {
      grid-column: 4 / 13;
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      column-gap: 20px;
      row-gap: 14px;
    }
    body.swiss header nav a {
      color: var(--s-text);
      text-decoration: none;
      font-size: var(--fs-small);
      line-height: 1.3;
      padding-top: 8px;
      border-top: 1px solid var(--s-text);
    }
    body.swiss header nav a:hover {
      color: var(--s-text);
      text-decoration: none;
      border-top: 3px solid var(--s-peacock);
      padding-top: 6px;
    }

    /* the thick rule under the header */
    body.swiss .rule {
      grid-column: 1 / -1;
      height: 0;
      border-top: 3px solid var(--s-text);
    }

    /* ---------- main block ---------- */
    body.swiss main.home {
      row-gap: 0;
      padding-top: 0;
      padding-bottom: 0;
      text-align: left;
    }

    /* left column: the lab name, set big and flush left */
    body.swiss .title {
      grid-column: 1 / 6;
      grid-row: 2;
      align-self: start;
      margin: 28px 0 0;
      font-size: var(--fs-title);
      font-weight: 700;
      line-height: 0.98;
      letter-spacing: -0.02em;
      text-transform: none;
    }
    body.swiss .title span.line { display: block; }
    body.swiss .flip {
      display: inline-block;
      transform: scaleX(-1);
      color: var(--s-peacock);
    }

    /* the sentence under the name */
    body.swiss .tagline {
      grid-column: 1 / 5;
      grid-row: 3;
      align-self: start;
      margin: 24px 0 0;
      padding-top: 8px;
      border-top: 1px solid var(--s-text);
      font-size: var(--fs-body);
    }
    body.swiss .tagline::before {
      content: "";
      display: block;
      width: 28px;
      height: 6px;
      background: var(--s-yellow);
      margin-bottom: 10px;
    }

    /* right column: the picture */
    body.swiss figure.picture {
      grid-column: 7 / 13;
      grid-row: 2 / 5;
      margin: 28px 0 0;
      position: relative;
    }
    body.swiss figure.picture img {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 3;
      /* the picture never grows taller than the screen allows,
         so the whole homepage fits without scrolling */
      max-height: calc(100vh - 230px);
      max-height: calc(100svh - 230px);
      object-fit: cover;
      background: var(--s-line);
      box-shadow: none;
      filter: none;
    }
    /* flat colour blocks on the picture's edges */
    body.swiss figure.picture::before {
      content: "";
      position: absolute;
      top: 0; right: 0;
      width: 9%;
      aspect-ratio: 1 / 1;
      background: var(--s-peacock);
    }
    body.swiss figure.picture::after {
      content: "";
      display: block;
      height: 7px;
      width: 42%;
      background: var(--s-sienna);
    }

    /* ---------- footer rule ---------- */
    body.swiss footer.grid {
      padding-top: 28px;
      padding-bottom: 24px;
    }
    body.swiss footer .rule { border-top-width: 1px; }
    body.swiss footer p {
      margin: 10px 0 0;
      font-size: var(--fs-small);
      color: var(--s-dim);
    }
    body.swiss footer .left  { grid-column: 1 / 7; }
    body.swiss footer .right { grid-column: 7 / 13; text-align: right; }

    /* ---------- tablets ---------- */
    @media (max-width: 1000px) {
      body.swiss header .logo { grid-column: 1 / -1; margin-bottom: 20px; }
      body.swiss header nav {
        grid-column: 1 / -1;
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }

    /* ---------- phones: everything in one column ---------- */
    @media (max-width: 700px) {
      body.swiss header,
      body.swiss .grid { padding-left: 20px; padding-right: 20px; }
      body.swiss header nav { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      body.swiss .title,
      body.swiss .tagline,
      body.swiss figure.picture,
      body.swiss footer .left,
      body.swiss footer .right { grid-column: 1 / -1; grid-row: auto; }
      body.swiss .title { font-size: var(--fs-title); margin-top: 32px; }
      body.swiss footer.grid { padding-top: 24px; }
      body.swiss figure.picture { margin-top: 28px; }
      body.swiss figure.picture img { max-height: calc(100svh - 400px); }
      body.swiss footer .right { text-align: left; margin-top: 2px; }
    }
  </style>
</head>
<body class="swiss">

  <!-- ===== MENU (same links as every page) ===== -->
  <header>
    <a class="logo" href="index.html" aria-label="TNBL, home">TN<span class="flip">B</span>L</a>
    <nav>
      <a href="research.html">Research</a>
      <a href="people.html">People</a>
      <a href="publications.html">Publications</a>
      <a href="news.html">News &amp; views</a>
      <a href="resources.html">Resources</a>
      <a href="lab-tour.html">Lab tour</a>
      <a href="contacts.html">Contacts</a>
    </nav>
  </header>

  <main class="home grid">
    <div class="rule"></div>

    <!-- ✏️ EDIT: the lab name (each "line" is one line of the big title) -->
    <h1 class="title">
      <span class="line">Translational</span>
      <span class="line">Neuro<span class="flip">B</span>iology</span>
      <span class="line">Lab</span>
    </h1>

    <!-- ✏️ EDIT: the sentence under the name -->
    <p class="tagline">A laboratory for unconventional Science</p>

    <!-- ✏️ PICTURE: upload your own picture into the "images" folder with the name home.jpg -->
    <figure class="picture">
      <img src="images/home.jpg" alt="Translational Neurobiology Lab">
    </figure>
  </main>

  <footer class="grid">
    <div class="rule"></div>
    <p class="left">Translational Neurobiology Lab</p>
    <p class="right">Chieti-Pescara</p>
  </footer>

</body>
</html>
