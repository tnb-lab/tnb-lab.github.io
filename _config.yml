# Site settings read by GitHub Pages. You don't need to touch this file.
title: TNBL
description: Translational Neurobiology Lab (TNBL), Università G. d'Annunzio Chieti-Pescara.

# Every post uses the "post" page layout automatically,
# and gets its own address, e.g. /news/2026/welcome/
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      permalink: /news/:year/:title/

# Files that should not be published on the website
exclude:
  - .pages.yml
  - README.md
