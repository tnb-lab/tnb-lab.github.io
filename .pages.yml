# Settings for the Pages CMS visual editor (app.pagescms.org).
media:
  input: images/news
  output: /images/news

content:
  - name: posts
    label: News & views
    type: collection
    path: _posts
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [title, date]
      primary: title
      sort: [date]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Date
        type: date
        required: true
      - name: image
        label: Image (appears faded on the square, full size in the post)
        type: image
      - name: body
        label: Text
        type: rich-text
